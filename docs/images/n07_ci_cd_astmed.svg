<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="a7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#43a047"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#fb8c00"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">CI → Continuous Delivery → Continuous Deployment</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#5e35b1">vahe on selles, kui kaugele automaatika jõuab ilma inimeseta</text>

  <g font-size="13" text-anchor="middle">
    <rect x="20" y="110" width="120" height="70" rx="10" fill="#fff3e0" stroke="#ffa726" stroke-width="2"/>
    <text x="80" y="140" font-weight="700" fill="#e65100">git push</text><text x="80" y="160" font-size="11" fill="#ef6c00">PR</text>

    <rect x="180" y="110" width="160" height="70" rx="10" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
    <text x="260" y="140" font-weight="700" fill="#311b92">build + test</text><text x="260" y="160" font-size="11" fill="#5e35b1">pytest, docker build</text>

    <rect x="380" y="110" width="170" height="70" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
    <text x="465" y="140" font-weight="700" fill="#0d47a1">valmis pakk</text><text x="465" y="160" font-size="11" fill="#1565c0">image registris (GHCR)</text>

    <circle cx="610" cy="145" r="26" fill="#fff8e1" stroke="#fb8c00" stroke-width="2"/>
    <text x="610" y="151" font-size="20">🧑</text>
    <text x="610" y="194" font-size="11" fill="#e65100">inimene vajutab</text>

    <rect x="680" y="110" width="200" height="70" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <text x="780" y="140" font-weight="700" fill="#1b5e20">tootmine</text><text x="780" y="160" font-size="11" fill="#2e7d32">päris serverid, päris kasutajad</text>
  </g>
  <g stroke-width="2.5">
    <line x1="140" y1="145" x2="176" y2="145" stroke="#7e57c2" marker-end="url(#a7)"/>
    <line x1="340" y1="145" x2="376" y2="145" stroke="#7e57c2" marker-end="url(#a7)"/>
    <line x1="550" y1="145" x2="582" y2="145" stroke="#fb8c00" marker-end="url(#ao)"/>
    <line x1="636" y1="145" x2="676" y2="145" stroke="#fb8c00" marker-end="url(#ao)"/>
    <path d="M465,182 C465,250 780,250 780,186" fill="none" stroke="#43a047" stroke-dasharray="7 5" marker-end="url(#ag)"/>
  </g>
  <text x="622" y="244" text-anchor="middle" font-size="11" fill="#2e7d32">automaatselt, kui testid on rohelised</text>

  <!-- brackets -->
  <g font-size="13" font-weight="700">
    <rect x="20" y="268" width="320" height="24" rx="5" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="180" y="285" text-anchor="middle" fill="#311b92">Continuous Integration — N7</text>
    <rect x="20" y="298" width="590" height="24" rx="5" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="315" y="315" text-anchor="middle" fill="#0d47a1">Continuous Delivery — N8 (tootmisse inimese nupuga)</text>
    <rect x="20" y="328" width="860" height="24" rx="5" fill="#e8f5e9" stroke="#43a047"/>
    <text x="450" y="345" text-anchor="middle" fill="#1b5e20">Continuous Deployment — tootmisse ilma inimeseta, testid on ainus värav</text>
  </g>
</svg>
