<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/></marker></defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Sündmus käivitab töövoo, töövoos on tööd, töös on sammud</text>

  <rect x="20" y="70" width="190" height="150" rx="10" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="115" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0d47a1">Sündmus (on:)</text>
  <g font-size="13" fill="#1565c0" font-family="ui-monospace, Menlo, monospace">
    <text x="40" y="128">push → main</text><text x="40" y="152">pull_request</text>
    <text x="40" y="176" fill="#90a4ae">schedule</text><text x="40" y="200" fill="#90a4ae">workflow_dispatch</text>
  </g>

  <line x1="210" y1="145" x2="268" y2="145" stroke="#5e35b1" stroke-width="2" marker-end="url(#a)"/>
  <rect x="272" y="105" width="200" height="80" rx="10" fill="#5e35b1"/>
  <text x="372" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Töövoog</text>
  <text x="372" y="160" text-anchor="middle" font-size="12" fill="#d1c4e9" font-family="ui-monospace, Menlo, monospace">.github/workflows/ci.yml</text>

  <path d="M372 185 L372 225 L150 225 L150 255" stroke="#5e35b1" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M372 225 L450 225 L450 255" stroke="#5e35b1" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M450 225 L750 225 L750 255" stroke="#5e35b1" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <g font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">
    <rect x="50" y="258" width="200" height="44" rx="8" fill="#b39ddb"/><text x="150" y="286" fill="#311b92">test</text>
    <rect x="350" y="258" width="200" height="44" rx="8" fill="#b39ddb"/><text x="450" y="286" fill="#311b92">konteiner</text>
    <rect x="650" y="258" width="200" height="44" rx="8" fill="#b39ddb"/><text x="750" y="286" fill="#311b92">build-and-push</text>
  </g>
  <text x="50" y="248" font-size="12" fill="#5e35b1" font-weight="700">tööd (jobs)</text>
  <g stroke="#e65100" stroke-width="2" fill="none">
    <line x1="250" y1="280" x2="346" y2="280" marker-end="url(#a)"/><line x1="550" y1="280" x2="646" y2="280" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#e65100" font-weight="700" text-anchor="middle">
    <text x="298" y="272">needs</text><text x="598" y="272">needs</text>
  </g>

  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#4527a0">
    <rect x="50" y="315" width="200" height="110" rx="8" fill="#ede7f6"/>
    <text x="64" y="340">1 checkout</text><text x="64" y="362">2 setup-python</text><text x="64" y="384">3 pip install</text><text x="64" y="406">4 pytest</text>
    <rect x="350" y="315" width="200" height="110" rx="8" fill="#ede7f6"/>
    <text x="364" y="340">1 checkout</text><text x="364" y="362">2 docker build</text><text x="364" y="384">3 docker run</text><text x="364" y="406">4 curl /health</text>
    <rect x="650" y="315" width="200" height="110" rx="8" fill="#ede7f6"/>
    <text x="664" y="340">1 checkout</text><text x="664" y="362">2 docker build</text><text x="664" y="384">3 docker login</text><text x="664" y="406">4 docker push</text>
  </g>
  <text x="450" y="450" text-anchor="middle" font-size="12" fill="#616161">sammud (steps) käivad töö sees järjest; uses: on valmis action, run: on käsk</text>

  <rect x="520" y="70" width="360" height="115" rx="10" fill="#fff8e1" stroke="#ffb300"/>
  <text x="540" y="96" font-size="14" font-weight="700" fill="#e65100">Ilma needs'ita</text>
  <text x="540" y="120" font-size="13" fill="#6d4c41">käivituvad kõik tööd korraga.</text>
  <text x="540" y="142" font-size="13" fill="#6d4c41">Siis ehitatakse image ka siis,</text>
  <text x="540" y="164" font-size="13" fill="#6d4c41">kui test kukub (praktikumi viga 2).</text>
</svg>
