<svg viewBox="0 0 900 260" width="900" height="260" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4527a0">Üks käsk, õige järjekord</text>
  <rect x="300" y="48" width="300" height="36" rx="8" fill="#4527a0"/>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#fff" font-family="ui-monospace, Menlo, monospace">terragrunt run --all apply</text>

  <rect x="40" y="120" width="200" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="140" y="148" text-anchor="middle" font-size="13" fill="#0d47a1" font-weight="700">1.</text>
  <text x="140" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#0d47a1">võrk</text>
  <text x="140" y="192" text-anchor="middle" font-size="12" fill="#616161">väljund: võrgu ID</text>

  <rect x="350" y="120" width="200" height="90" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="450" y="148" text-anchor="middle" font-size="13" fill="#bf360c" font-weight="700">2.</text>
  <text x="450" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#bf360c">andmebaas</text>
  <text x="450" y="192" text-anchor="middle" font-size="12" fill="#616161">vajab võrgu ID-d</text>

  <rect x="660" y="120" width="200" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="760" y="148" text-anchor="middle" font-size="13" fill="#1b5e20" font-weight="700">3.</text>
  <text x="760" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">veebiserverid</text>
  <text x="760" y="192" text-anchor="middle" font-size="12" fill="#616161">vajavad võrku ja andmebaasi</text>

  <line x1="240" y1="165" x2="348" y2="165" stroke="#616161" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="550" y1="165" x2="658" y2="165" stroke="#616161" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="294" y="156" text-anchor="middle" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, monospace">dependency</text>
  <text x="604" y="156" text-anchor="middle" font-size="11" fill="#616161" font-family="ui-monospace, Menlo, monospace">dependency</text>
  <text x="450" y="242" text-anchor="middle" font-size="12" fill="#616161">Terragrunt loeb sõltuvused failidest ja käivitab OpenTofu igas kaustas eraldi, õiges järjekorras</text>
</svg>
