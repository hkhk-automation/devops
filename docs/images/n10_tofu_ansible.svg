<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker></defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">OpenTofu loob masina, Ansible seadistab selle sisu</text>

  <rect x="30" y="70" width="190" height="90" rx="10" fill="#4527a0"/>
  <text x="125" y="106" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1. OpenTofu</text>
  <text x="125" y="128" text-anchor="middle" font-size="12" fill="#d1c4e9" font-family="ui-monospace, Menlo, monospace">tofu apply</text>
  <text x="125" y="146" text-anchor="middle" font-size="12" fill="#d1c4e9">olekufail: loodud ressursid</text>

  <rect x="30" y="250" width="190" height="90" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="125" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#bf360c">2. Ansible</text>
  <text x="125" y="308" text-anchor="middle" font-size="12" fill="#e65100" font-family="ui-monospace, Menlo, monospace">ansible-playbook</text>
  <text x="125" y="326" text-anchor="middle" font-size="12" fill="#e65100">olekut ei mäleta</text>

  <line x1="220" y1="115" x2="388" y2="115" stroke="#616161" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="304" y="107" text-anchor="middle" font-size="12" fill="#4527a0" font-weight="700">API (HTTPS)</text>
  <text x="304" y="134" text-anchor="middle" font-size="11" fill="#616161">Proxmox, AWS, Azure</text>

  <line x1="220" y1="295" x2="388" y2="295" stroke="#616161" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="304" y="287" text-anchor="middle" font-size="12" fill="#bf360c" font-weight="700">SSH</text>
  <text x="304" y="314" text-anchor="middle" font-size="11" fill="#616161">masina sisse</text>

  <path d="M125 160 L125 250" stroke="#7e57c2" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="135" y="200" font-size="12" fill="#4527a0" font-weight="700">output: IP-aadress</text>
  <text x="135" y="216" font-size="12" fill="#616161">läheb inventory'sse</text>

  <rect x="392" y="60" width="480" height="300" rx="12" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="632" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#424242">virtuaalmasin tofu-&lt;kasutaja&gt;</text>

  <rect x="412" y="96" width="440" height="78" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="430" y="120" font-size="13" font-weight="700" fill="#311b92">masin ise (OpenTofu)</text>
  <text x="430" y="142" font-size="13" fill="#4527a0">kas masin on olemas, tuumad, mälu, ketas,</text>
  <text x="430" y="161" font-size="13" fill="#4527a0">võrgukaart, mall, tagid, pool</text>

  <rect x="412" y="250" width="440" height="92" rx="8" fill="#fff3e0" stroke="#ffa726"/>
  <text x="430" y="274" font-size="13" font-weight="700" fill="#bf360c">masina sisu (Ansible)</text>
  <text x="430" y="296" font-size="13" fill="#e65100">paketid (nginx), konfiguratsioonifailid,</text>
  <text x="430" y="315" font-size="13" fill="#e65100">teenused, kasutajad, tulemüür</text>

  <text x="632" y="205" text-anchor="middle" font-size="12" fill="#616161">operatsioonisüsteem (AlmaLinux mallist)</text>
  <line x1="412" y1="215" x2="852" y2="215" stroke="#bdbdbd" stroke-dasharray="3 3"/>
</svg>
