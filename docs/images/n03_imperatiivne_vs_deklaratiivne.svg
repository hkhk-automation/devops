<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="imp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3e0"/>
      <stop offset="1" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="dek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede7f6"/>
      <stop offset="1" stop-color="#d1c4e9"/>
    </linearGradient>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Imperatiivne vs deklaratiivne</text>

  <!-- IMPERATIIVNE -->
  <rect x="30" y="60" width="390" height="340" rx="14" fill="url(#imp)" stroke="#ffa726" stroke-width="2"/>
  <text x="225" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">IMPERATIIVNE</text>
  <text x="225" y="110" text-anchor="middle" font-size="12" fill="#ef6c00">ütle MIDA TEHA — samm-sammult</text>

  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#5d4037">
    <rect x="70" y="128" width="310" height="36" rx="7" fill="#fff" stroke="#ffcc80"/>
    <text x="86" y="151">apt install nginx</text>
    <rect x="70" y="192" width="310" height="36" rx="7" fill="#fff" stroke="#ffcc80"/>
    <text x="86" y="215">cp nginx.conf /etc/nginx/</text>
    <rect x="70" y="256" width="310" height="36" rx="7" fill="#fff" stroke="#ffcc80"/>
    <text x="86" y="279">systemctl start nginx</text>
  </g>
  <line x1="225" y1="164" x2="225" y2="190" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a3)"/>
  <line x1="225" y1="228" x2="225" y2="254" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="225" y="330" text-anchor="middle" font-size="12" fill="#bf360c" font-weight="600">Järjekord loeb.</text>
  <text x="225" y="352" text-anchor="middle" font-size="12" fill="#bf360c">Kordamisel teeb sammud uuesti.</text>
  <text x="225" y="378" text-anchor="middle" font-size="11" fill="#8d6e63">(nii töötab Bash-skript)</text>

  <!-- DEKLARATIIVNE -->
  <rect x="480" y="60" width="390" height="340" rx="14" fill="url(#dek)" stroke="#7e57c2" stroke-width="2"/>
  <text x="675" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#4527a0">DEKLARATIIVNE</text>
  <text x="675" y="110" text-anchor="middle" font-size="12" fill="#5e35b1">ütle MIS PEAB OLEMA — soovitud seisund</text>

  <rect x="520" y="132" width="310" height="150" rx="9" fill="#fff" stroke="#b39ddb"/>
  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#311b92">
    <text x="540" y="160">nginx:</text>
    <text x="560" y="182">state: present</text>
    <text x="540" y="214">teenus:</text>
    <text x="560" y="236">state: started</text>
    <text x="560" y="258">enabled: true</text>
  </g>
  <text x="675" y="330" text-anchor="middle" font-size="12" fill="#4527a0" font-weight="600">Ansible otsustab sammud ise.</text>
  <text x="675" y="352" text-anchor="middle" font-size="12" fill="#4527a0">Kordamisel ei muuda midagi.</text>
  <text x="675" y="378" text-anchor="middle" font-size="11" fill="#7e57c2">(nii töötab Ansible)</text>
</svg>
