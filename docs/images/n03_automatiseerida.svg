<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9e9e9e"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Kas tasub automatiseerida?</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#666">üks kord ehitad — pärast seda tasub end ära iga kordusega</text>

  <line x1="120" y1="390" x2="820" y2="390" stroke="#9e9e9e" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="120" y1="390" x2="120" y2="80" stroke="#9e9e9e" stroke-width="2" marker-end="url(#ax)"/>
  <text x="470" y="440" text-anchor="middle" font-size="13" fill="#666">korduste arv (mitu korda ülesannet teed)</text>
  <text x="88" y="240" text-anchor="middle" font-size="13" fill="#666" transform="rotate(-90 88 240)">kulunud aeg kokku</text>

  <line x1="384" y1="283" x2="384" y2="390" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="384" cy="283" r="6" fill="#fff" stroke="#5e35b1" stroke-width="2.5"/>
  <text x="384" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">tasuvuspunkt</text>

  <line x1="120" y1="390" x2="810" y2="110" stroke="#ff9100" stroke-width="3"/>
  <rect x="600" y="112" width="200" height="46" rx="9" fill="#fff3e0" stroke="#ffa726"/>
  <text x="700" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">Käsitsi</text>
  <text x="700" y="150" text-anchor="middle" font-size="11" fill="#ef6c00">aeg kasvab iga kordusega</text>

  <line x1="120" y1="300" x2="810" y2="255" stroke="#5e35b1" stroke-width="3"/>
  <rect x="440" y="300" width="240" height="46" rx="9" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="560" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#4527a0">Automatiseeritud (Ansible)</text>
  <text x="560" y="338" text-anchor="middle" font-size="11" fill="#5e35b1">üks kord ehitad, siis peaaegu tasuta</text>

  <text x="250" y="378" text-anchor="middle" font-size="11" fill="#8d6e63">vähe kordi → käsitsi kiirem</text>
  <text x="600" y="378" text-anchor="middle" font-size="11" fill="#4527a0">palju kordi → automatiseeri</text>
</svg>
