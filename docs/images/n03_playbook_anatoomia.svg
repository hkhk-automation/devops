<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Playbooki anatoomia</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#666">üks fail = loend play'sid · play = sõnastik · tasks = loend sõnastikke</text>

  <!-- code panel -->
  <rect x="40" y="76" width="560" height="360" rx="12" fill="#faf8fd" stroke="#d1c4e9" stroke-width="1.5"/>

  <!-- PLAY bracket -->
  <rect x="56" y="92" width="528" height="328" rx="8" fill="none" stroke="#7e57c2" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- TASK bracket -->
  <rect x="72" y="210" width="500" height="196" rx="7" fill="none" stroke="#ffa726" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- MODULE bracket (inner, one task's module) -->
  <rect x="96" y="276" width="464" height="116" rx="6" fill="none" stroke="#66bb6a" stroke-width="2" stroke-dasharray="4 3"/>

  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#311b92">
    <text x="72" y="122">- name: Seadista veebiserver</text>
    <text x="92" y="146">hosts: webservers</text>
    <text x="92" y="170">become: true</text>
    <text x="92" y="200">tasks:</text>
    <text x="112" y="234">- name: Paigalda nginx</text>
    <text x="132" y="262">apt:</text>
    <text x="152" y="290">name: nginx</text>
    <text x="152" y="318">state: present</text>
    <text x="112" y="354">- name: Käivita nginx</text>
    <text x="132" y="382" fill="#9e9e9e">service: ...</text>
  </g>

  <!-- labels on the right -->
  <g font-size="13" font-weight="700">
    <rect x="628" y="98" width="232" height="52" rx="9" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="744" y="120" text-anchor="middle" fill="#4527a0">PLAY</text>
    <text x="744" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#5e35b1">üks hosts-plokk (kogu fail)</text>

    <rect x="628" y="230" width="232" height="52" rx="9" fill="#fff3e0" stroke="#ffa726"/>
    <text x="744" y="252" text-anchor="middle" fill="#e65100">TASK</text>
    <text x="744" y="272" text-anchor="middle" font-size="11" font-weight="400" fill="#ef6c00">üks samm</text>

    <rect x="628" y="308" width="232" height="52" rx="9" fill="#e8f5e9" stroke="#66bb6a"/>
    <text x="744" y="330" text-anchor="middle" fill="#2e7d32">MOODUL</text>
    <text x="744" y="350" text-anchor="middle" font-size="11" font-weight="400" fill="#388e3c">tööriist + parameetrid</text>
  </g>

  <!-- connector lines from brackets to labels -->
  <line x1="584" y1="124" x2="628" y2="124" stroke="#7e57c2" stroke-width="2"/>
  <line x1="572" y1="256" x2="628" y2="256" stroke="#ffa726" stroke-width="2"/>
  <line x1="560" y1="334" x2="628" y2="334" stroke="#66bb6a" stroke-width="2"/>
</svg>
