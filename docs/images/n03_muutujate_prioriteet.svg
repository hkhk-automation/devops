<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="up" markerWidth="12" markerHeight="12" refX="4" refY="2" orient="auto">
      <path d="M4,0 L8,6 L0,6 Z" fill="#7e57c2"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Muutujate prioriteet — kes võidab</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#666">sama muutuja mitmes kohas: ülemine kirjutab alumise üle</text>

  <line x1="150" y1="410" x2="150" y2="112" stroke="#7e57c2" stroke-width="3" marker-end="url(#up)"/>
  <text x="132" y="270" text-anchor="middle" font-size="13" fill="#5e35b1" transform="rotate(-90 132 270)">prioriteet kasvab</text>

  <g font-size="14">
    <rect x="210" y="356" width="560" height="46" rx="9" fill="#f5f5f5" stroke="#bdbdbd"/>
    <text x="230" y="384" fill="#616161">1 · rollide vaikimisi muutujad (defaults)</text>
    <text x="750" y="384" text-anchor="end" font-size="11" fill="#9e9e9e">madalaim</text>

    <rect x="210" y="300" width="560" height="46" rx="9" fill="#ede7f6" stroke="#b39ddb"/>
    <text x="230" y="328" fill="#4527a0">2 · group_vars — grupi muutujad</text>

    <rect x="210" y="244" width="560" height="46" rx="9" fill="#e1d5f5" stroke="#9575cd"/>
    <text x="230" y="272" fill="#4527a0">3 · host_vars — hosti muutujad</text>

    <rect x="210" y="188" width="560" height="46" rx="9" fill="#d1c4e9" stroke="#7e57c2"/>
    <text x="230" y="216" fill="#311b92">4 · play-taseme vars:</text>

    <rect x="210" y="120" width="560" height="52" rx="10" fill="#ffe0b2" stroke="#ffa726" stroke-width="2"/>
    <text x="230" y="150" fill="#e65100" font-weight="700">5 · extra-vars (-e) käsurealt</text>
    <text x="750" y="150" text-anchor="end" font-size="12" fill="#e65100" font-weight="700">VÕIDAB</text>
  </g>
</svg>
