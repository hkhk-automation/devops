<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="cp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3e0"/>
      <stop offset="1" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="tp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede7f6"/>
      <stop offset="1" stop-color="#d1c4e9"/>
    </linearGradient>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">copy vs template</text>

  <!-- COPY -->
  <rect x="30" y="60" width="390" height="370" rx="14" fill="url(#cp)" stroke="#ffa726" stroke-width="2"/>
  <text x="225" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">copy</text>
  <text x="225" y="110" text-anchor="middle" font-size="12" fill="#ef6c00">fail läheb serverisse MUUTMATA</text>

  <rect x="70" y="128" width="310" height="44" rx="7" fill="#fff" stroke="#ffcc80"/>
  <text x="86" y="147" font-size="11" fill="#8d6e63">sinu arvutis: index.html.j2</text>
  <text x="86" y="164" font-family="JetBrains Mono, monospace" font-size="13" fill="#5d4037">Server: {{ inventory_hostname }}</text>

  <line x1="225" y1="172" x2="225" y2="222" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="240" y="202" font-size="11" fill="#8d6e63">kopeeritakse</text>

  <rect x="70" y="226" width="310" height="44" rx="7" fill="#fff" stroke="#ffcc80"/>
  <text x="86" y="245" font-size="11" fill="#8d6e63">proxmox1: index.html</text>
  <text x="86" y="262" font-family="JetBrains Mono, monospace" font-size="13" fill="#bf360c">Server: {{ inventory_hostname }}</text>

  <text x="225" y="330" text-anchor="middle" font-size="12" fill="#bf360c" font-weight="600">{{ }} jääb sõna-sõnalt alles.</text>
  <text x="225" y="352" text-anchor="middle" font-size="12" fill="#bf360c">Kõik serverid saavad sama faili.</text>
  <text x="225" y="378" text-anchor="middle" font-size="11" fill="#8d6e63">(sobib piltidele, staatilistele failidele)</text>

  <!-- TEMPLATE -->
  <rect x="480" y="60" width="390" height="370" rx="14" fill="url(#tp)" stroke="#7e57c2" stroke-width="2"/>
  <text x="675" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#4527a0">template</text>
  <text x="675" y="110" text-anchor="middle" font-size="12" fill="#5e35b1">Jinja2 asendab {{ }} SINU ARVUTIS, iga hosti jaoks</text>

  <rect x="520" y="128" width="310" height="44" rx="7" fill="#fff" stroke="#b39ddb"/>
  <text x="536" y="147" font-size="11" fill="#7e57c2">sinu arvutis: index.html.j2</text>
  <text x="536" y="164" font-family="JetBrains Mono, monospace" font-size="13" fill="#311b92">Server: {{ inventory_hostname }}</text>

  <line x1="620" y1="172" x2="590" y2="222" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a4)"/>
  <line x1="730" y1="172" x2="760" y2="222" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="675" y="202" text-anchor="middle" font-size="11" fill="#5e35b1">renderdatakse</text>

  <rect x="500" y="226" width="170" height="44" rx="7" fill="#fff" stroke="#b39ddb"/>
  <text x="512" y="245" font-size="11" fill="#7e57c2">proxmox1</text>
  <text x="512" y="262" font-family="JetBrains Mono, monospace" font-size="12" fill="#311b92">Server: proxmox1</text>

  <rect x="680" y="226" width="170" height="44" rx="7" fill="#fff" stroke="#b39ddb"/>
  <text x="692" y="245" font-size="11" fill="#7e57c2">proxmox2</text>
  <text x="692" y="262" font-family="JetBrains Mono, monospace" font-size="12" fill="#311b92">Server: proxmox2</text>

  <text x="675" y="330" text-anchor="middle" font-size="12" fill="#4527a0" font-weight="600">Serverisse jõuab valmis tekst.</text>
  <text x="675" y="352" text-anchor="middle" font-size="12" fill="#4527a0">Üks mall, igal serveril oma tulemus.</text>
  <text x="675" y="378" text-anchor="middle" font-size="11" fill="#7e57c2">(sobib konfiguratsioonile)</text>
</svg>
