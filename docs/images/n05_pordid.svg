<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="ct" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede7f6"/><stop offset="1" stop-color="#d1c4e9"/></linearGradient>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">-p HOST:KONTEINER — vasakpoolne port peab olema vaba</text>
  <rect x="30" y="140" width="150" height="70" rx="10" fill="#fff" stroke="#9e9e9e" stroke-width="2"/>
  <text x="105" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#424242">Brauser / curl</text>
  <text x="105" y="190" text-anchor="middle" font-size="11" fill="#616161">VM-IP:8080 / :8081</text>
  <rect x="230" y="60" width="640" height="270" rx="14" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="550" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#424242">Sinu Ubuntu VM (host)</text>
  <g font-family="JetBrains Mono, monospace" font-size="13">
    <rect x="260" y="110" width="110" height="40" rx="6" fill="#fff" stroke="#7e57c2" stroke-width="2"/><text x="315" y="135" text-anchor="middle" fill="#311b92">:8080</text>
    <rect x="260" y="180" width="110" height="40" rx="6" fill="#fff" stroke="#7e57c2" stroke-width="2"/><text x="315" y="205" text-anchor="middle" fill="#311b92">:8081</text>
    <rect x="260" y="250" width="110" height="40" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="315" y="275" text-anchor="middle" fill="#c62828">:8080 ✗</text>
  </g>
  <g font-size="13">
    <rect x="520" y="104" width="320" height="52" rx="10" fill="url(#ct)" stroke="#7e57c2" stroke-width="2"/><text x="680" y="126" text-anchor="middle" font-weight="700" fill="#311b92">web1 — nginx :80</text><text x="680" y="145" text-anchor="middle" font-size="11" fill="#5e35b1">-p 8080:80</text>
    <rect x="520" y="174" width="320" height="52" rx="10" fill="url(#ct)" stroke="#7e57c2" stroke-width="2"/><text x="680" y="196" text-anchor="middle" font-weight="700" fill="#311b92">web2 — nginx :80</text><text x="680" y="215" text-anchor="middle" font-size="11" fill="#5e35b1">-p 8081:80</text>
    <rect x="520" y="244" width="320" height="52" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="680" y="266" text-anchor="middle" font-weight="700" fill="#c62828">web2 -p 8080:80</text><text x="680" y="285" text-anchor="middle" font-size="11" fill="#c62828">port is already allocated</text>
  </g>
  <line x1="182" y1="165" x2="256" y2="132" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="182" y1="185" x2="256" y2="198" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="372" y1="130" x2="516" y2="130" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a5)"/>
  <line x1="372" y1="200" x2="516" y2="200" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a5)"/>
  <line x1="372" y1="270" x2="516" y2="270" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text x="444" y="122" text-anchor="middle" font-size="11" fill="#5e35b1">host → konteiner</text>
  <text x="550" y="320" text-anchor="middle" font-size="12" fill="#424242">Konteineri sees võib igaüks kasutada porti 80, sest konteinerid on eraldi. Hosti port on aga üks.</text>
</svg>
