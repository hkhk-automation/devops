<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Kolm tööriista, üks mudel — aga mis saab masinast?</text>

  <!-- column headers -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="150" y="72" fill="#311b92">GitHub Actions</text>
    <text x="450" y="72" fill="#e65100">GitLab CI</text>
    <text x="750" y="72" fill="#b71c1c">Jenkins</text>
  </g>
  <g font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">
    <text x="150" y="92" fill="#5e35b1">.github/workflows/ci.yml</text>
    <text x="450" y="92" fill="#ef6c00">.gitlab-ci.yml</text>
    <text x="750" y="92" fill="#c62828">Jenkinsfile</text>
  </g>

  <!-- run rows -->
  <g font-size="12" fill="#616161">
    <text x="12" y="140">run 1</text><text x="12" y="210">run 2</text><text x="12" y="280">run 3</text>
  </g>

  <!-- GitHub: fresh VM each time -->
  <g font-size="12" text-anchor="middle">
    <rect x="70" y="112" width="160" height="50" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="150" y="134" fill="#311b92" font-weight="700">uus VM</text><text x="150" y="151" font-size="10" fill="#5e35b1">tühi</text>
    <rect x="70" y="182" width="160" height="50" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="150" y="204" fill="#311b92" font-weight="700">uus VM</text><text x="150" y="221" font-size="10" fill="#5e35b1">tühi</text>
    <rect x="70" y="252" width="160" height="50" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="150" y="274" fill="#311b92" font-weight="700">uus VM</text><text x="150" y="291" font-size="10" fill="#5e35b1">tühi</text>

    <rect x="370" y="112" width="160" height="50" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="450" y="134" fill="#bf360c" font-weight="700">uus konteiner</text><text x="450" y="151" font-size="10" fill="#ef6c00">image: python:3.12</text>
    <rect x="370" y="182" width="160" height="50" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="450" y="204" fill="#bf360c" font-weight="700">uus konteiner</text><text x="450" y="221" font-size="10" fill="#ef6c00">image: python:3.12</text>
    <rect x="370" y="252" width="160" height="50" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="450" y="274" fill="#bf360c" font-weight="700">uus konteiner</text><text x="450" y="291" font-size="10" fill="#ef6c00">image: python:3.12</text>

    <!-- Jenkins: same server growing -->
    <rect x="670" y="112" width="160" height="190" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
    <text x="750" y="134" fill="#424242" font-weight="700">SAMA server</text>
    <text x="750" y="150" font-size="10" fill="#616161">jookseb kuude kaupa</text>
    <rect x="684" y="162" width="132" height="24" rx="5" fill="#fff" stroke="#bdbdbd"/><text x="750" y="178" font-size="10" fill="#424242">run 1 jäägid</text>
    <rect x="684" y="192" width="132" height="24" rx="5" fill="#fff" stroke="#bdbdbd"/><text x="750" y="208" font-size="10" fill="#424242">+ run 2 jäägid</text>
    <rect x="684" y="222" width="132" height="24" rx="5" fill="#ffebee" stroke="#e53935"/><text x="750" y="238" font-size="10" fill="#b71c1c">+ „ajutiselt" pip install</text>
    <rect x="684" y="252" width="132" height="24" rx="5" fill="#fff" stroke="#bdbdbd"/><text x="750" y="268" font-size="10" fill="#424242">+ run 3 jäägid</text>
    <text x="750" y="292" font-size="10" fill="#b71c1c">„töötab Jenkinsi masinas"</text>
  </g>

  <!-- bottom row: checkout / python -->
  <g font-size="12">
    <rect x="20" y="326" width="860" height="78" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
    <text x="40" y="350" font-weight="700" fill="#424242">kood:</text>
    <text x="150" y="350" text-anchor="middle" fill="#311b92">actions/checkout (ise)</text>
    <text x="450" y="350" text-anchor="middle" fill="#bf360c">automaatne</text>
    <text x="750" y="350" text-anchor="middle" fill="#b71c1c">automaatne (SCM)</text>
    <text x="40" y="374" font-weight="700" fill="#424242">Python:</text>
    <text x="150" y="374" text-anchor="middle" fill="#311b92">setup-python</text>
    <text x="450" y="374" text-anchor="middle" fill="#bf360c">image: python:3.12</text>
    <text x="750" y="374" text-anchor="middle" fill="#b71c1c">peab serveris olemas olema</text>
    <text x="40" y="396" font-weight="700" fill="#424242">järjekord:</text>
    <text x="150" y="396" text-anchor="middle" fill="#311b92" font-family="ui-monospace, Menlo, monospace">needs:</text>
    <text x="450" y="396" text-anchor="middle" fill="#bf360c" font-family="ui-monospace, Menlo, monospace">stages:</text>
    <text x="750" y="396" text-anchor="middle" fill="#b71c1c" font-family="ui-monospace, Menlo, monospace">stage() järjest</text>
  </g>
</svg>
