<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="a7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#43a047"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e53935"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">CI sysadminile — kontrolli enne, kui server näeb</text>

  <text x="120" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#e65100">Sinu failid Gitis</text>
  <text x="430" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#4527a0">Kontroll CI-s</text>
  <text x="770" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#424242">Tulemus</text>

  <g font-size="12">
    <g font-family="ui-monospace, Menlo, monospace" fill="#bf360c">
      <rect x="20" y="86" width="200" height="40" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="34" y="111">site.yml</text><text x="206" y="111" text-anchor="end" font-size="10" font-family="Inter, sans-serif">N3–N4</text>
      <rect x="20" y="138" width="200" height="40" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="34" y="163">site.yml × 2</text><text x="206" y="163" text-anchor="end" font-size="10" font-family="Inter, sans-serif">N3</text>
      <rect x="20" y="190" width="200" height="40" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="34" y="215">monitor.sh</text><text x="206" y="215" text-anchor="end" font-size="10" font-family="Inter, sans-serif">N2</text>
      <rect x="20" y="242" width="200" height="40" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="34" y="267">nginx.conf</text><text x="206" y="267" text-anchor="end" font-size="10" font-family="Inter, sans-serif">N3</text>
      <rect x="20" y="294" width="200" height="40" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="34" y="319">Dockerfile</text><text x="206" y="319" text-anchor="end" font-size="10" font-family="Inter, sans-serif">N5</text>
      <rect x="20" y="346" width="200" height="40" rx="8" fill="#fff3e0" stroke="#ffa726"/><text x="34" y="371">kogu repo</text><text x="206" y="371" text-anchor="end" font-size="10" font-family="Inter, sans-serif">N2, N4</text>
    </g>
    <g fill="#311b92">
      <rect x="290" y="86" width="280" height="40" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="304" y="104" font-weight="700">syntax-check + ansible-lint</text><text x="304" y="119" font-size="10" fill="#5e35b1">taane, command mooduli asemel service</text>
      <rect x="290" y="138" width="280" height="40" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="304" y="156" font-weight="700">idempotentsus</text><text x="304" y="171" font-size="10" fill="#5e35b1">teine käivitus peab andma changed=0</text>
      <rect x="290" y="190" width="280" height="40" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="304" y="208" font-weight="700">shellcheck</text><text x="304" y="223" font-size="10" fill="#5e35b1">jutumärkideta muutujad, cd ilma kontrollita</text>
      <rect x="290" y="242" width="280" height="40" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="304" y="260" font-weight="700">nginx -t konteineris</text><text x="304" y="275" font-size="10" fill="#5e35b1">katkine konf enne reload'i</text>
      <rect x="290" y="294" width="280" height="40" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="304" y="312" font-weight="700">hadolint</text><text x="304" y="327" font-size="10" fill="#5e35b1">latest tag, root-kasutaja</text>
      <rect x="290" y="346" width="280" height="40" rx="8" fill="#ede7f6" stroke="#7e57c2"/><text x="304" y="364" font-weight="700">gitleaks</text><text x="304" y="379" font-size="10" fill="#5e35b1">parool või webhook commitis</text>
    </g>
  </g>
  <g stroke="#7e57c2" stroke-width="2" marker-end="url(#a7)">
    <line x1="222" y1="106" x2="286" y2="106"/><line x1="222" y1="158" x2="286" y2="158"/><line x1="222" y1="210" x2="286" y2="210"/>
    <line x1="222" y1="262" x2="286" y2="262"/><line x1="222" y1="314" x2="286" y2="314"/><line x1="222" y1="366" x2="286" y2="366"/>
  </g>

  <!-- result -->
  <rect x="650" y="100" width="240" height="110" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="770" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1b5e20">✓ kõik roheline</text>
  <text x="770" y="152" text-anchor="middle" font-size="12" fill="#2e7d32">merge → playbook</text>
  <g fill="#43a047"><rect x="684" y="166" width="22" height="26" rx="3"/><rect x="712" y="166" width="22" height="26" rx="3"/><rect x="740" y="166" width="22" height="26" rx="3"/><rect x="768" y="166" width="22" height="26" rx="3"/><rect x="796" y="166" width="22" height="26" rx="3"/><rect x="824" y="166" width="22" height="26" rx="3"/></g>
  <text x="770" y="206" text-anchor="middle" font-size="10" fill="#2e7d32">20 serverit</text>

  <rect x="650" y="262" width="240" height="110" rx="12" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="770" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#b71c1c">✗ üks punane</text>
  <text x="770" y="316" text-anchor="middle" font-size="12" fill="#c62828">merge blokeeritud</text>
  <text x="770" y="336" text-anchor="middle" font-size="12" fill="#c62828">ükski server ei näinud viga</text>
  <text x="770" y="358" text-anchor="middle" font-size="10" fill="#c62828">parandus 30 sekundiga, mitte reedel 17:30</text>

  <line x1="574" y1="200" x2="646" y2="160" stroke="#43a047" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="574" y1="280" x2="646" y2="312" stroke="#e53935" stroke-width="2.5" marker-end="url(#ar)"/>

  <text x="450" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#4527a0">Sysadmini „kood" on ka tekst Gitis — sama konveier, teised kontrollid.</text>
</svg>
