<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Iga Dockerfile'i rida on kiht. Muudatuse korral ehitatakse uuesti ainult sealt alates.</text>
  <text x="200" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#4527a0">Dockerfile</text>
  <text x="680" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#4527a0">Uus build pärast app.py muutmist</text>
  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#311b92">
    <rect x="40" y="80" width="320" height="40" rx="6" fill="#ede7f6" stroke="#b39ddb"/><text x="56" y="105">FROM python:3.12-slim</text>
    <rect x="40" y="128" width="320" height="40" rx="6" fill="#ede7f6" stroke="#b39ddb"/><text x="56" y="153">WORKDIR /app</text>
    <rect x="40" y="176" width="320" height="40" rx="6" fill="#ede7f6" stroke="#b39ddb"/><text x="56" y="201">COPY requirements.txt .</text>
    <rect x="40" y="224" width="320" height="40" rx="6" fill="#ede7f6" stroke="#b39ddb"/><text x="56" y="249">RUN pip install -r ...</text>
    <rect x="40" y="272" width="320" height="40" rx="6" fill="#fff3e0" stroke="#ffa726" stroke-width="2"/><text x="56" y="297">COPY . .</text><text x="270" y="297" font-size="11" fill="#e65100">← app.py</text>
    <rect x="40" y="320" width="320" height="40" rx="6" fill="#ede7f6" stroke="#b39ddb"/><text x="56" y="345">CMD ["python","app.py"]</text>
  </g>
  <g font-size="13">
    <line x1="370" y1="100" x2="500" y2="100" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
    <line x1="370" y1="148" x2="500" y2="148" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
    <line x1="370" y1="196" x2="500" y2="196" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
    <line x1="370" y1="244" x2="500" y2="244" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
    <line x1="370" y1="292" x2="500" y2="292" stroke="#fb8c00" stroke-width="2" marker-end="url(#a5)"/>
    <line x1="370" y1="340" x2="500" y2="340" stroke="#fb8c00" stroke-width="2" marker-end="url(#a5)"/>
    <rect x="510" y="80" width="340" height="184" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <text x="680" y="160" text-anchor="middle" font-weight="700" fill="#2e7d32" font-size="16">CACHED ✓</text>
    <text x="680" y="184" text-anchor="middle" fill="#2e7d32">vahemälust, 0 sekundit</text>
    <text x="680" y="204" text-anchor="middle" fill="#2e7d32">(pip install EI jookse uuesti)</text>
    <rect x="510" y="272" width="340" height="88" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
    <text x="680" y="310" text-anchor="middle" font-weight="700" fill="#e65100" font-size="16">ehitatakse uuesti</text>
    <text x="680" y="334" text-anchor="middle" fill="#bf360c">muutunud kiht ja kõik selle all olevad</text>
  </g>
  <text x="450" y="390" text-anchor="middle" font-size="12" fill="#5e35b1">Reegel: harva muutuv üles, tihti muutuv (sinu kood) alla.</text>
</svg>
