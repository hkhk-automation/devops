<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/></marker></defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Meeskonnas käivitab OpenTofu ühine platvorm</text>

  <g font-size="13" text-anchor="middle">
    <rect x="20" y="80" width="150" height="70" rx="10" fill="#fafafa" stroke="#9e9e9e"/>
    <text x="95" y="110" font-weight="700" fill="#212121">pull request</text><text x="95" y="130" fill="#616161">muudatus .tf failis</text>

    <rect x="210" y="80" width="150" height="70" rx="10" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="285" y="110" font-weight="700" fill="#311b92">tofu plan</text><text x="285" y="130" fill="#5e35b1">plaan PR-i juurde</text>

    <rect x="400" y="80" width="150" height="70" rx="10" fill="#fff8e1" stroke="#ffb300"/>
    <text x="475" y="110" font-weight="700" fill="#e65100">reeglid</text><text x="475" y="130" fill="#ef6c00">kas kustutamine lubatud?</text>

    <rect x="590" y="80" width="130" height="70" rx="10" fill="#fafafa" stroke="#9e9e9e"/>
    <text x="655" y="104" font-weight="700" fill="#212121">kinnitus</text><text x="655" y="122" fill="#616161">teine inimene</text><text x="655" y="138" fill="#616161">vaatab üle</text>

    <rect x="760" y="80" width="120" height="70" rx="10" fill="#4527a0"/>
    <text x="820" y="110" font-weight="700" fill="#fff">tofu apply</text><text x="820" y="130" fill="#d1c4e9">pärast merge'i</text>
  </g>
  <g stroke="#7e57c2" stroke-width="1.8">
    <line x1="170" y1="115" x2="207" y2="115" marker-end="url(#a)"/><line x1="360" y1="115" x2="397" y2="115" marker-end="url(#a)"/>
    <line x1="550" y1="115" x2="587" y2="115" marker-end="url(#a)"/><line x1="720" y1="115" x2="757" y2="115" marker-end="url(#a)"/>
  </g>

  <rect x="210" y="200" width="300" height="70" rx="10" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="360" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">olekufail ja saladused platvormis</text>
  <text x="360" y="248" text-anchor="middle" font-size="12" fill="#2e7d32">ühine, lukustatud, krüpteeritud</text>

  <rect x="560" y="200" width="320" height="70" rx="10" fill="#ffebee" stroke="#e57373"/>
  <text x="720" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">triivi tuvastus</text>
  <text x="720" y="248" text-anchor="middle" font-size="12" fill="#c62828">plan iga paari tunni järel: kas keegi muutis käsitsi?</text>

  <path d="M820 150 L820 185 L510 185 L510 200" stroke="#9e9e9e" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  <text x="450" y="306" text-anchor="middle" font-size="12" fill="#616161">Spacelift, HCP Terraform, env0, Scalr; avatud lähtekoodiga Atlantis; lihtsamal juhul GitHub Actions</text>
</svg>
