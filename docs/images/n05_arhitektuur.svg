<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="ct" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede7f6"/><stop offset="1" stop-color="#d1c4e9"/></linearGradient>
    <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3e0"/><stop offset="1" stop-color="#ffe0b2"/></linearGradient>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Mis juhtub, kui kirjutad docker run</text>

  <rect x="30" y="60" width="200" height="220" rx="14" fill="url(#cl)" stroke="#ffa726" stroke-width="2"/>
  <text x="130" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#e65100">Klient</text>
  <g font-size="12" text-anchor="middle" fill="#bf360c">
    <rect x="50" y="104" width="160" height="36" rx="6" fill="#fff" stroke="#ffcc80"/><text x="130" y="127" font-family="JetBrains Mono, monospace">docker CLI</text>
    <rect x="50" y="148" width="160" height="36" rx="6" fill="#fff" stroke="#ffcc80"/><text x="130" y="171">VS Code Container Tools</text>
    <rect x="50" y="192" width="160" height="36" rx="6" fill="#fff" stroke="#ffcc80"/><text x="130" y="215">Ansible, CI, skriptid</text>
    <text x="130" y="258" font-size="11">kõik räägivad sama REST API-ga</text>
  </g>

  <rect x="290" y="60" width="380" height="370" rx="14" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="480" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#424242">Docker host (sinu Alma VM)</text>
  <g text-anchor="middle">
    <rect x="320" y="104" width="320" height="50" rx="8" fill="#fff" stroke="#5e35b1" stroke-width="2"/>
    <text x="480" y="125" font-size="13" font-weight="700" fill="#311b92" font-family="JetBrains Mono, monospace">/var/run/docker.sock</text>
    <text x="480" y="143" font-size="11" fill="#5e35b1">ligipääs = docker grupp ≈ root</text>
    <rect x="320" y="172" width="320" height="50" rx="8" fill="url(#ct)" stroke="#5e35b1" stroke-width="2"/>
    <text x="480" y="194" font-size="14" font-weight="700" fill="#311b92">dockerd — deemon</text>
    <text x="480" y="212" font-size="11" fill="#5e35b1">image'id, võrgud, volume'd, build</text>
    <rect x="320" y="240" width="320" height="44" rx="8" fill="url(#ct)" stroke="#7e57c2"/>
    <text x="480" y="260" font-size="13" font-weight="700" fill="#311b92">containerd</text>
    <text x="480" y="276" font-size="11" fill="#5e35b1">konteinerite elutsükkel (CNCF)</text>
    <rect x="320" y="300" width="320" height="40" rx="8" fill="url(#ct)" stroke="#7e57c2"/>
    <text x="480" y="325" font-size="13" font-weight="700" fill="#311b92">runc — käivitab (OCI)</text>
    <g font-size="11" fill="#311b92">
      <rect x="320" y="356" width="96" height="40" rx="6" fill="#fff" stroke="#7e57c2"/><text x="368" y="381">web1</text>
      <rect x="432" y="356" width="96" height="40" rx="6" fill="#fff" stroke="#7e57c2"/><text x="480" y="381">web2</text>
      <rect x="544" y="356" width="96" height="40" rx="6" fill="#fff" stroke="#7e57c2"/><text x="592" y="381">flask</text>
    </g>
    <text x="480" y="418" font-size="11" fill="#424242">Linuxi tuum: namespaces + cgroups</text>
  </g>

  <rect x="720" y="150" width="160" height="110" rx="14" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="800" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">Registry</text>
  <text x="800" y="202" text-anchor="middle" font-size="12" fill="#1565c0">Docker Hub</text>
  <text x="800" y="220" text-anchor="middle" font-size="12" fill="#1565c0">ghcr.io, quay.io</text>
  <text x="800" y="244" text-anchor="middle" font-size="11" fill="#1565c0">pull / push</text>

  <line x1="232" y1="160" x2="316" y2="130" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a5)"/>
  <text x="272" y="132" text-anchor="middle" font-size="10" fill="#5e35b1">REST</text>
  <line x1="480" y1="154" x2="480" y2="170" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="480" y1="222" x2="480" y2="238" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="480" y1="284" x2="480" y2="298" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="480" y1="340" x2="480" y2="354" stroke="#7e57c2" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="642" y1="197" x2="716" y2="200" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#a5)"/>
  <text x="450" y="458" text-anchor="middle" font-size="12" fill="#5e35b1">Podman: sama ahel ilma dockerd-ta — CLI kutsub runtime'i otse, kasutaja õigustes.</text>
</svg>
