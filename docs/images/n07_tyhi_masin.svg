<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="a7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Sinu VM vs runner, mida tühi masin ei tea</text>

  <!-- Sinu VM -->
  <rect x="20" y="56" width="300" height="370" rx="14" fill="#fff3e0" stroke="#ffa726" stroke-width="2"/>
  <text x="170" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">Sinu AlmaLinuxi VM</text>
  <text x="170" y="102" text-anchor="middle" font-size="11" fill="#ef6c00">kogunenud kuude jooksul</text>
  <g font-size="13" fill="#bf360c">
    <rect x="40" y="116" width="260" height="46" rx="8" fill="#fff" stroke="#ffcc80"/><text x="56" y="144">✓ kood (git clone)</text>
    <rect x="40" y="172" width="260" height="46" rx="8" fill="#fff" stroke="#ffcc80"/><text x="56" y="200">✓ Python 3</text>
    <rect x="40" y="228" width="260" height="46" rx="8" fill="#fff" stroke="#ffcc80"/><text x="56" y="256">✓ Flask (pip install, N5)</text>
    <rect x="40" y="284" width="260" height="46" rx="8" fill="#fff" stroke="#ffcc80"/><text x="56" y="312">✓ pytest (Osa 0)</text>
    <rect x="40" y="340" width="260" height="46" rx="8" fill="#ffe0b2" stroke="#fb8c00" stroke-width="2"/><text x="56" y="361">✓ requests</text><text x="56" y="377" font-size="10" fill="#e65100">kunagi paigaldatud, keegi ei mäleta</text>
  </g>

  <!-- workflow column -->
  <text x="450" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#4527a0">ci.yml rida</text>
  <text x="450" y="102" text-anchor="middle" font-size="11" fill="#5e35b1">mis toob selle runnerisse</text>
  <g font-size="11" text-anchor="middle" fill="#311b92" font-family="ui-monospace, Menlo, monospace">
    <rect x="345" y="122" width="210" height="34" rx="6" fill="#ede7f6" stroke="#7e57c2"/><text x="450" y="144">actions/checkout</text>
    <rect x="345" y="178" width="210" height="34" rx="6" fill="#ede7f6" stroke="#7e57c2"/><text x="450" y="200">actions/setup-python</text>
    <rect x="345" y="234" width="210" height="34" rx="6" fill="#ede7f6" stroke="#7e57c2"/><text x="450" y="256" font-size="10">pip install -r requirements.txt</text>
    <rect x="345" y="290" width="210" height="34" rx="6" fill="#ede7f6" stroke="#7e57c2"/><text x="450" y="312">pip install pytest</text>
    <rect x="345" y="346" width="210" height="34" rx="6" fill="#ffebee" stroke="#e53935" stroke-dasharray="5 4"/><text x="450" y="362" fill="#b71c1c">- puudub -</text><text x="450" y="375" font-size="9" fill="#b71c1c" font-family="Inter, sans-serif">pole requirements.txt-is</text>
  </g>
  <g stroke="#7e57c2" stroke-width="2" marker-end="url(#a7)">
    <line x1="557" y1="139" x2="598" y2="139"/>
    <line x1="557" y1="195" x2="598" y2="195"/>
    <line x1="557" y1="251" x2="598" y2="251"/>
    <line x1="557" y1="307" x2="598" y2="307"/>
  </g>

  <!-- Runner -->
  <rect x="600" y="56" width="280" height="370" rx="14" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="740" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#424242">GitHubi runner</text>
  <text x="740" y="102" text-anchor="middle" font-size="11" fill="#616161">värske Ubuntu, iga run nullist</text>
  <g font-size="13" fill="#1b5e20">
    <rect x="618" y="116" width="244" height="46" rx="8" fill="#e8f5e9" stroke="#43a047"/><text x="634" y="144">✓ kood</text>
    <rect x="618" y="172" width="244" height="46" rx="8" fill="#e8f5e9" stroke="#43a047"/><text x="634" y="200">✓ Python 3.12</text>
    <rect x="618" y="228" width="244" height="46" rx="8" fill="#e8f5e9" stroke="#43a047"/><text x="634" y="256">✓ Flask</text>
    <rect x="618" y="284" width="244" height="46" rx="8" fill="#e8f5e9" stroke="#43a047"/><text x="634" y="312">✓ pytest</text>
    <rect x="618" y="340" width="244" height="46" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="2"/><text x="634" y="361" fill="#b71c1c">✗ requests</text><text x="634" y="377" font-size="10" fill="#c62828">ModuleNotFoundError → punane X</text>
  </g>

  <text x="450" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#4527a0">Runnerisse jõuab ainult see, mis on repositooriumis kirjas.</text>
</svg>
