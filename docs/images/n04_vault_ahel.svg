<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="git" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede7f6"/>
      <stop offset="1" stop-color="#d1c4e9"/>
    </linearGradient>
    <linearGradient id="loc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3e0"/>
      <stop offset="1" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="srv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f5"/>
      <stop offset="1" stop-color="#e0e0e0"/>
    </linearGradient>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7e57c2"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#4527a0">Kus saladus on krüpteeritud — ja kus mitte</text>

  <!-- GIT -->
  <rect x="30" y="60" width="260" height="250" rx="14" fill="url(#git)" stroke="#7e57c2" stroke-width="2"/>
  <text x="160" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#4527a0">Git (repo)</text>
  <text x="160" y="108" text-anchor="middle" font-size="11" fill="#5e35b1">näevad kõik, kel ligipääs</text>
  <rect x="50" y="124" width="220" height="72" rx="8" fill="#fff" stroke="#b39ddb"/>
  <text x="62" y="144" font-size="11" fill="#7e57c2">group_vars/all/vault.yml</text>
  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#311b92">
    <text x="62" y="164">$ANSIBLE_VAULT;1.1;AES256</text>
    <text x="62" y="182">6638643965323633...</text>
  </g>
  <text x="160" y="232" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="700">krüpteeritud ✓</text>
  <text x="160" y="256" text-anchor="middle" font-size="11" fill="#4527a0">ilma paroolita loetamatu</text>

  <!-- LOCAL -->
  <rect x="320" y="60" width="260" height="250" rx="14" fill="url(#loc)" stroke="#ffa726" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#e65100">Sinu arvuti</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#ef6c00">Gitist väljas (.gitignore)</text>
  <rect x="340" y="124" width="220" height="72" rx="8" fill="#fff" stroke="#ffcc80"/>
  <text x="352" y="144" font-size="11" fill="#8d6e63">.vault_pass</text>
  <text x="352" y="170" font-family="JetBrains Mono, monospace" font-size="12" fill="#5d4037">SuperSalajane123</text>
  <text x="450" y="232" text-anchor="middle" font-size="13" fill="#bf360c" font-weight="700">võti — selge tekst</text>
  <text x="450" y="256" text-anchor="middle" font-size="11" fill="#bf360c">chmod 600, mitte kunagi Giti</text>

  <!-- SERVER -->
  <rect x="610" y="60" width="260" height="250" rx="14" fill="url(#srv)" stroke="#9e9e9e" stroke-width="2"/>
  <text x="740" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#424242">Server (proxmox1)</text>
  <text x="740" y="108" text-anchor="middle" font-size="11" fill="#616161">rakendus peab parooli lugema</text>
  <rect x="630" y="124" width="220" height="72" rx="8" fill="#fff" stroke="#bdbdbd"/>
  <text x="642" y="144" font-size="11" fill="#757575">renderdatud config</text>
  <text x="642" y="170" font-family="JetBrains Mono, monospace" font-size="12" fill="#424242">password=SuperSalajane123</text>
  <text x="740" y="232" text-anchor="middle" font-size="13" fill="#bf360c" font-weight="700">selge tekst</text>
  <text x="740" y="256" text-anchor="middle" font-size="11" fill="#616161">kaitse: mode '0600', owner</text>

  <!-- FLOW -->
  <rect x="250" y="340" width="400" height="56" rx="10" fill="#fff" stroke="#7e57c2" stroke-width="2"/>
  <text x="450" y="364" text-anchor="middle" font-size="13" fill="#311b92" font-weight="700">ansible-playbook --vault-password-file .vault_pass</text>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#5e35b1">dekrüpteerib MÄLUS → template → SSH</text>
  <line x1="160" y1="310" x2="280" y2="340" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a5)"/>
  <line x1="450" y1="310" x2="450" y2="338" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a5)"/>
  <line x1="620" y1="340" x2="730" y2="312" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#a5)"/>
</svg>
